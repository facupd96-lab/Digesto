<title>Mostrador Registral</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --ground:#F1F3F7; --surface:#FFFFFF; --surface-2:#E9ECF2; --surface-3:#DDE2EA;
  --ink:#0E1218; --ink-2:#424B57; --ink-3:#6B7582;
  --line:#D5DAE3; --line-strong:#B4BCC8;
  --accent:#123E86; --accent-ink:#FFFFFF; --accent-soft:#E5ECF9; --accent-line:#AFC2E4;
  --ok:#14603D; --ok-soft:#E3F1EA; --ok-line:#A9D2BE;
  --warn:#7A4A00; --warn-soft:#FBF0D9; --warn-line:#E4C88E;
  --danger:#8E2018; --danger-soft:#FBE7E4; --danger-line:#E5B2AB;
  --sans:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif;
  --serif:'Source Serif 4',Georgia,'Times New Roman',serif;
  --mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
  --r:8px; --shadow:0 1px 2px rgba(14,18,24,.05),0 6px 20px rgba(14,18,24,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0C0F14; --surface:#151A21; --surface-2:#1D242E; --surface-3:#28313D;
    --ink:#EDF0F5; --ink-2:#B3BCC9; --ink-3:#828C99;
    --line:#28303B; --line-strong:#3D4854;
    --accent:#9CBBF5; --accent-ink:#0C0F14; --accent-soft:#172236; --accent-line:#2F4162;
    --ok:#6DCBA0; --ok-soft:#122720; --ok-line:#265242;
    --warn:#E8BC72; --warn-soft:#2A2112; --warn-line:#4D3C1B;
    --danger:#F0968C; --danger-soft:#2E1816; --danger-line:#542924;
    --shadow:0 1px 2px rgba(0,0,0,.5),0 6px 20px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --ground:#0C0F14; --surface:#151A21; --surface-2:#1D242E; --surface-3:#28313D;
  --ink:#EDF0F5; --ink-2:#B3BCC9; --ink-3:#828C99;
  --line:#28303B; --line-strong:#3D4854;
  --accent:#9CBBF5; --accent-ink:#0C0F14; --accent-soft:#172236; --accent-line:#2F4162;
  --ok:#6DCBA0; --ok-soft:#122720; --ok-line:#265242;
  --warn:#E8BC72; --warn-soft:#2A2112; --warn-line:#4D3C1B;
  --danger:#F0968C; --danger-soft:#2E1816; --danger-line:#542924;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 6px 20px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;font-weight:700;text-wrap:balance;letter-spacing:-.015em;line-height:1.25}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}
.mono{font-family:var(--mono)}

/* ---------- encabezado ---------- */
.top{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:13px;padding:12px 20px}
.plate{display:inline-flex;align-items:stretch;border:2px solid var(--ink);border-radius:5px;overflow:hidden;line-height:1;flex:none}
.plate .eu{background:var(--accent);color:#fff;font-size:8.5px;font-weight:700;letter-spacing:.05em;padding:6px 4px;
  display:flex;align-items:flex-end;justify-content:center;writing-mode:vertical-rl;transform:rotate(180deg)}
.plate .no{font-family:var(--mono);font-weight:500;font-size:15px;letter-spacing:.1em;padding:7px 9px;background:var(--surface)}
.top h1{font-size:18px;letter-spacing:-.02em;white-space:nowrap}
.top .sub{font-size:12.5px;color:var(--ink-3);white-space:nowrap}
.top .sp{flex:1}
.tinybtn{background:transparent;border:1.5px solid var(--line-strong);border-radius:var(--r);padding:7px 14px;font-size:14px;color:var(--ink-2)}
.tinybtn:hover{background:var(--surface-2);color:var(--ink)}

/* ---------- estructura ---------- */
.shell{display:grid;grid-template-columns:246px minmax(0,1fr)}
.rail{position:sticky;top:var(--h-top,74px);align-self:start;min-height:calc(100vh - var(--h-top,74px));
  border-right:1px solid var(--line);padding:18px 12px 22px;display:flex;flex-direction:column;gap:4px}
.rail button{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:transparent;border:0;
  border-radius:var(--r);padding:12px 14px;font-size:16.5px;font-weight:500;color:var(--ink-2)}
.rail button:hover{background:var(--surface-2);color:var(--ink)}
.rail button[aria-current="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.rail .ic{font-size:17px;width:20px;text-align:center;flex:none;opacity:.9}
.rail .fill{flex:1}
.rail .low{margin-top:auto;padding-top:14px;border-top:1px solid var(--line)}
.rail .low button{font-size:14px;padding:9px 14px;color:var(--ink-3);font-weight:400}
main{padding:30px 26px 90px;min-width:0}
.wrap{max-width:820px;margin:0 auto}
@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .top{position:static}
  .rail{position:sticky;top:0;min-height:0;flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);
    background:var(--surface);padding:9px 12px;gap:6px;z-index:20}
  .rail button{width:auto;white-space:nowrap;padding:9px 12px;font-size:14.5px}
  .rail .ic{display:none}
  .rail{gap:4px;scrollbar-width:none}
  .rail::-webkit-scrollbar{display:none}
  .rail .low{margin-top:0;padding-top:0;border-top:0;display:flex;gap:6px}
  .top .sub{display:none} #btn-imprimir{display:none}
  main{padding:20px 16px 80px}
}

/* ---------- piezas ---------- */
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-3);font-weight:700}
.lede{color:var(--ink-2);font-size:17px;max-width:62ch;margin-top:6px}
.btn{background:var(--accent);color:var(--accent-ink);border:2px solid var(--accent);border-radius:var(--r);
  padding:13px 24px;font-size:17px;font-weight:600}
.btn.ghost{background:transparent;color:var(--ink-2);border-color:var(--line-strong);font-weight:500}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
input[type=search],input[type=text],textarea,select{
  background:var(--surface);border:2px solid var(--line-strong);border-radius:var(--r);color:var(--ink);
  font-family:inherit;font-size:17px;padding:12px 14px;width:100%}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.note{font-size:14.5px;color:var(--ink-3);line-height:1.5}
.empty{padding:30px 18px;text-align:center;color:var(--ink-3);font-size:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}

/* ---------- caja de consulta ---------- */
.ask{background:var(--surface);border:2px solid var(--accent-line);border-radius:12px;padding:20px;box-shadow:var(--shadow)}
.ask label{display:block;font-size:19px;font-weight:600;margin-bottom:12px}
.ask .row{display:flex;gap:10px;flex-wrap:wrap}
.ask input{flex:1 1 340px;font-size:19px;padding:15px 16px}
.ask .hint{margin-top:11px;font-size:14.5px;color:var(--ink-3)}

/* ---------- botones grandes de pregunta / trámite ---------- */
.qbtn{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;background:var(--surface);
  border:1.5px solid var(--line);border-radius:var(--r);padding:15px 17px;font-size:17px;line-height:1.4;color:var(--ink)}
.qbtn:hover{border-color:var(--accent);background:var(--accent-soft)}
.qbtn .ar{color:var(--accent);font-size:19px;flex:none;line-height:1.4}
.qbtn .tg{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;font-weight:700;color:var(--ink-3);flex:none}
.stack{display:flex;flex-direction:column;gap:9px;margin-top:14px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:11px;margin-top:14px}
.tile{text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:17px 18px;
  display:flex;flex-direction:column;gap:5px;min-height:92px;justify-content:center}
.tile:hover{border-color:var(--accent);background:var(--accent-soft)}
.tile .t{font-size:18px;font-weight:600;line-height:1.3}
.tile .c{font-size:14px;color:var(--ink-3)}
.tile .chip{align-self:flex-start;margin-top:3px;font-size:11px;font-weight:700;
  text-transform:uppercase;letter-spacing:.06em;color:var(--accent);
  border:1px solid var(--accent-line);border-radius:4px;padding:2px 7px}
.tile.hot{border-color:var(--accent-line)}

/* ---------- ficha ---------- */
.ficha{background:var(--surface);border:1.5px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:var(--shadow)}
.ficha .hd{padding:16px 20px 0}
.ficha .tg{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--accent)}
.ficha .pg{font-size:19px;font-weight:600;margin-top:5px;line-height:1.35;color:var(--ink-2)}
.ver{margin:14px 20px 18px;padding:17px 19px;background:var(--accent-soft);border:1.5px solid var(--accent-line);
  border-radius:8px;font-family:var(--serif);font-size:21.5px;line-height:1.45;font-weight:600;color:var(--ink)}
.blk{padding:15px 20px;border-top:1px solid var(--line)}
.blk h4{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-3);margin:0 0 9px;font-weight:700}
.blk.oj{background:var(--warn-soft);border-top-color:var(--warn-line)}
.blk.oj h4{color:var(--warn)} .blk.oj .tx{color:var(--warn)}
.blk .tx{font-size:16px;line-height:1.55;color:var(--ink-2)}
.cg{margin-top:11px;padding-left:13px;border-left:4px solid var(--line-strong)}
.cg:first-of-type{margin-top:0}
.cg.inc{border-left-color:var(--ok)} .cg.sum{border-left-color:var(--accent)} .cg.sac{border-left-color:var(--danger)}
.cg .ct{font-size:12.5px;text-transform:uppercase;letter-spacing:.06em;font-weight:700;margin-bottom:5px}
.cg.inc .ct{color:var(--ok)} .cg.sum .ct{color:var(--accent)} .cg.sac .ct{color:var(--danger)}
.cg ul{margin:0;padding-left:19px;display:flex;flex-direction:column;gap:4px}
.cg li{font-size:15.5px;line-height:1.5;color:var(--ink-2)}
details.mas{border-top:1px solid var(--line)}
details.mas>summary{cursor:pointer;list-style:none;padding:14px 20px;font-size:15.5px;font-weight:600;color:var(--accent);
  display:flex;align-items:center;gap:9px;background:var(--surface-2)}
details.mas>summary::-webkit-details-marker{display:none}
details.mas>summary::before{content:"▸";font-size:13px;transition:transform .15s}
details.mas[open]>summary::before{transform:rotate(90deg)}
details.mas .inner{padding:4px 20px 18px}
.detalle{font-family:var(--serif);font-size:17px;line-height:1.6;white-space:pre-wrap;color:var(--ink);margin-bottom:16px}
.fu{display:flex;flex-direction:column;gap:4px;padding-left:13px;border-left:3px solid var(--accent-line);margin-bottom:12px}
.fu button{align-self:flex-start;background:none;border:0;padding:0;font-family:var(--mono);font-size:13.5px;
  color:var(--accent);text-align:left;text-decoration:underline;text-underline-offset:3px}
.fu .d{color:var(--ink-2);font-size:15px;line-height:1.5}
.reserva{font-size:14.5px;color:var(--ink-3);border-top:1px dashed var(--line-strong);padding-top:11px;line-height:1.5}
.curso{display:inline-block;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;font-weight:700;color:var(--warn);
  background:var(--warn-soft);border:1px solid var(--warn-line);border-radius:4px;padding:2px 7px;margin-left:8px;vertical-align:2px}

/* ---------- digesto ---------- */
.acc{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);margin-top:10px;overflow:hidden}
.acc>summary{cursor:pointer;padding:14px 17px;display:flex;align-items:center;gap:11px;list-style:none;font-weight:600;font-size:16.5px}
.acc>summary::-webkit-details-marker{display:none}
.acc>summary::before{content:"▸";color:var(--ink-3);font-size:13px;transition:transform .15s;flex:none}
.acc[open]>summary::before{transform:rotate(90deg)}
.acc .cnt{margin-left:auto;font-family:var(--mono);font-size:13px;color:var(--ink-3);font-weight:400}
.sec{border-top:1px solid var(--line);padding:12px 17px 14px}
.sec .sh{font-size:13.5px;font-weight:600;color:var(--ink-2);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{font-family:var(--mono);font-size:13.5px;background:var(--surface-2);border:1px solid var(--line);
  border-radius:5px;padding:5px 10px;color:var(--ink-2)}
.chips button:hover{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}
.res{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden;margin-top:12px}
.res button{display:block;width:100%;text-align:left;background:transparent;border:0;border-top:1px solid var(--line);padding:14px 17px}
.res button:first-child{border-top:0}
.res button:hover{background:var(--surface-2)}
.res .ct{font-family:var(--mono);font-size:13.5px;color:var(--accent);margin-bottom:4px}
.res .sp{font-family:var(--serif);font-size:15.5px;color:var(--ink-2);line-height:1.45;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.art .head{padding-bottom:16px;border-bottom:3px solid var(--ink)}
.art h2{font-size:23px}
.art .ctx{font-size:13.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;font-weight:600;margin-top:6px}
.art .body{font-family:var(--serif);font-size:18px;line-height:1.65;white-space:pre-wrap;margin-top:20px;max-width:66ch}
.box{border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:0 var(--r) var(--r) 0;
  background:var(--surface);padding:14px 17px;margin-top:14px}
.box h4{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-3);margin-bottom:8px}
.box .tx{font-size:15.5px;color:var(--ink-2);white-space:pre-wrap;line-height:1.55}
.box.avi{border-left-color:var(--warn);background:var(--warn-soft);border-color:var(--warn-line)}
.rowbtns{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}

/* ---------- para nosotros ---------- */
.nota{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:13px 16px;
  display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.nota .mt{font-size:12.5px;color:var(--ink-3);font-family:var(--mono);margin-top:4px}
.nota button{background:none;border:0;color:var(--ink-3);font-size:19px;line-height:1;padding:2px 5px;flex:none}
.nota button:hover{color:var(--danger)}
.pill{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;
  border:1px solid var(--line);color:var(--ink-2);background:var(--surface-2);text-transform:uppercase;letter-spacing:.05em}
.pill.dan{background:var(--danger-soft);border-color:var(--danger-line);color:var(--danger)}
.pill.acc{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}
footer{border-top:1px solid var(--line);margin-top:48px;padding-top:18px;font-size:13.5px;color:var(--ink-3);line-height:1.6}

/* ---------- reglas maestras ---------- */
.regla{background:var(--surface);border:2px solid var(--accent-line);border-radius:10px;overflow:hidden;box-shadow:var(--shadow)}
.regla .hd{padding:17px 20px 0}
.regla .tg{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--accent)}
.regla .tt{font-size:24px;font-weight:700;margin-top:5px;line-height:1.25}
.regla .pg{font-size:16px;color:var(--ink-3);margin-top:5px;line-height:1.4}
.regla .entrada{padding:0 20px;margin-top:14px;font-size:16.5px;color:var(--ink-2);line-height:1.55}
.tw{overflow-x:auto;margin:16px 20px 4px;border:1px solid var(--line);border-radius:8px}
table.mx{border-collapse:collapse;width:100%;font-size:15.5px;min-width:440px}
table.mx caption{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.09em;font-weight:700;
  color:var(--ink-3);padding:11px 14px 9px;background:var(--surface-2);border-bottom:1px solid var(--line)}
table.mx th,table.mx td{padding:10px 14px;text-align:left;border-top:1px solid var(--line);vertical-align:top;font-variant-numeric:tabular-nums}
table.mx thead th{background:var(--surface-2);font-size:12.5px;text-transform:uppercase;letter-spacing:.05em;
  color:var(--ink-3);font-weight:700;border-top:0}
table.mx tbody th{font-weight:600;color:var(--ink)}
table.mx td{color:var(--ink-2)}
table.mx tbody tr:nth-child(even){background:color-mix(in srgb,var(--surface-2) 45%,transparent)}
.tpie{margin:9px 20px 0;font-size:14.5px;color:var(--ink-3);line-height:1.5}
.casos{margin:18px 20px 4px;display:flex;flex-direction:column;gap:9px}
.caso{border:1px solid var(--line);border-left:4px solid var(--danger);border-radius:0 8px 8px 0;
  background:var(--surface);padding:12px 15px}
.caso .cu{font-size:16.5px;font-weight:600;line-height:1.35}
.caso .en{font-size:14px;color:var(--ink-3);margin-top:3px}
.caso .co{font-size:15.5px;color:var(--danger);font-weight:600;margin-top:6px}
.previo{margin:18px 20px 4px;background:var(--ok-soft);border:1px solid var(--ok-line);border-radius:8px;padding:14px 16px}
.previo h4{font-size:12.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--ok);font-weight:700;margin:0 0 7px}
.previo p{font-size:15.5px;color:var(--ink-2);line-height:1.5}
.previo ul{margin:9px 0 0;padding-left:19px;display:flex;flex-direction:column;gap:5px}
.previo li{font-size:15.5px;color:var(--ink-2);line-height:1.5}
.gris{margin:16px 20px 0;border:1px dashed var(--line-strong);border-radius:8px;padding:13px 15px;background:var(--surface-2)}
.gris h4{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-3);font-weight:700;margin:0 0 7px}
.gris p{font-size:15px;color:var(--ink-2);line-height:1.55}
.gris p+p{margin-top:9px}
.reglahome{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;background:var(--surface);
  border:1.5px solid var(--line);border-radius:10px;padding:15px 17px;font-size:17px;color:var(--ink)}
.reglahome:hover{border-color:var(--accent);background:var(--accent-soft)}
.reglahome .ar{line-height:1.35}
.reglahome .ar{color:var(--accent);font-size:19px;flex:none}
.reglahome b{display:block;font-size:17.5px}
.reglahome span.d{font-size:14.5px;color:var(--ink-3)}

/* ---------- avisar una duda ---------- */
.duda{margin-top:26px;border:1.5px dashed var(--line-strong);border-radius:10px;padding:18px;background:var(--surface)}
.duda h3{font-size:17.5px;font-weight:600}
.duda p{font-size:15px;color:var(--ink-3);margin-top:6px;line-height:1.5}
.duda textarea{margin-top:12px}
/* ---------- volver siempre a mano ---------- */
.ctx{position:sticky;top:var(--h-top,74px);z-index:18;background:var(--ground);
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:11px 0 12px;margin-bottom:10px;border-bottom:1px solid var(--line)}
.ctx button{display:inline-flex;align-items:center;gap:7px;background:var(--surface);
  border:1.5px solid var(--line-strong);border-radius:var(--r);padding:8px 15px;
  font-size:15.5px;font-weight:500;color:var(--ink-2);flex:none}
.ctx button:hover{background:var(--surface-2);color:var(--ink);border-color:var(--ink-3)}
.ctx .donde{font-size:14.5px;color:var(--ink-3);min-width:0;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.ctx .donde b{color:var(--ink-2);font-weight:600}
@media (max-width:900px){
  .ctx{top:var(--h-rail,54px);flex-wrap:nowrap;gap:11px;padding:9px 0 10px}
  .ctx button{padding:7px 12px;font-size:15px}
  .ctx .donde{flex:1 1 auto}
}

/* ---------- guia operativa del tramite ---------- */
.guia{background:var(--surface);border:2px solid var(--accent-line);border-radius:10px;overflow:hidden;box-shadow:var(--shadow)}
